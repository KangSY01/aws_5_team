AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: 부산 안내 예약 점검 - EventBridge Scheduler 가 Lambda 를 불러 저장된 일정을 Guardian 으로 점검하고 결과를 DynamoDB 에 저장한다 (GET /alerts 가 읽는다)

# AgentCore 스택(infra/template.yaml), 공용 스택(infra/base)과 별개로 배포한다. 서로 수정하지 않는다.
# DynamoDB 테이블은 공용 스택의 것을 그대로 쓴다. 이 스택은 테이블을 만들지도 바꾸지도 않는다.

Parameters:
  CodeBucket:
    Type: String
    Description: scripts/build_alerts_zip.py 결과를 올린 S3 버킷 (스택과 같은 리전)
  CodeKey:
    Type: String
    Description: 버킷 안의 zip 키. 코드가 바뀌면 키도 바뀌어야 Lambda 가 업데이트된다 (deploy_alerts.ps1 이 해시를 붙인다)
  DynamoDbTable:
    Type: String
    Default: busan-guide-sessions
    Description: 일정과 점검 결과(알림)를 저장하는 DynamoDB 단일 테이블 이름. 공용 스택(busan-guide-base)이 만든다
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: 예약 실행 켜기/끄기. 처음에는 DISABLED 로 배포하고, 수동 호출로 확인한 뒤 ENABLED 로 바꾼다. 끄면 Lambda 는 남고 자동 실행만 멈춘다
  ScheduleExpression:
    Type: String
    Default: cron(15 2,5,8,11,14,17,20,23 * * ? *)
    Description: 실행 시각 (Asia/Seoul 기준). 기본값은 단기예보 발표(02·05·08·11·14·17·20·23시) 15분 뒤
  DataGoKrKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 공공데이터포털 Decoding 키 (기상청 단기예보). 비어 있으면 예보 없이 점검한다(비 규칙은 건너뜀). Lambda 환경 변수로만 들어간다
  DemoNow:
    Type: String
    Default: ""
    Description: 비어 있지 않으면 현재 시각 대신 쓰는 ISO 시각 (시간 이동 데모). 이벤트의 now 가 있으면 그쪽이 먼저다
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 7, 14, 30, 60, 90]
    Description: CloudWatch 로그 보관 일수

Resources:
  CheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-check
      RetentionInDays: !Ref LogRetentionDays

  CheckRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role of the Busan guide scheduled plan check Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScheduledCheck
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CheckLogGroup.Arn
              # 점검이 쓰는 DynamoDB 동작만: 일정 읽기(GetItem), 일정 목록(Scan), 점검 결과 저장(PutItem)
              - Sid: PlansAndAlerts
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Scan]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDbTable}

  CheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-check
      Description: Scheduled Guardian check of stored plans. Writes sk=ALERTS items. No LLM.
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: !Ref CodeKey
      Handler: app.scheduled_handler.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt CheckRole.Arn
      LoggingConfig:
        LogGroup: !Ref CheckLogGroup
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DynamoDbTable
          DATA_GO_KR_KEY_DECODING: !Ref DataGoKrKey
          DEMO_NOW: !Ref DemoNow

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role that EventBridge Scheduler assumes to invoke the scheduled plan check Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeCheck
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CheckFunction.Arn

  CheckSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-check
      Description: Run the scheduled plan check after each short-term forecast release (Asia/Seoul)
      State: !Ref ScheduleState
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt CheckFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"source": "eventbridge-scheduler"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

Outputs:
  CheckFunctionName:
    Description: 수동 호출할 Lambda 이름 (aws lambda invoke --function-name)
    Value: !Ref CheckFunction
  CheckFunctionArn:
    Value: !GetAtt CheckFunction.Arn
  CheckLogGroupName:
    Description: 점검 로그 (CloudWatch Logs)
    Value: !Ref CheckLogGroup
  CheckScheduleName:
    Description: EventBridge Scheduler 스케줄 이름
    Value: !Ref CheckSchedule
