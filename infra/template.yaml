AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: 부산 안내 에이전트 - 1단계 Hello (AgentCore Runtime, 코드 zip 배포)

Parameters:
  AgentRuntimeName:
    Type: String
    Default: busan_guide_agent
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,47}"
    Description: AgentCore Runtime 이름 (영문자로 시작, 영문·숫자·밑줄만)
  CodeBucket:
    Type: String
    Description: build_zip.py 결과를 올린 S3 버킷 (스택과 같은 리전)
  CodeKey:
    Type: String
    Description: 버킷 안의 zip 키. 코드가 바뀌면 키도 바뀌어야 업데이트된다 (deploy.ps1 이 해시를 붙인다)
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-5-5
    Description: Bedrock 모델 ID. 런타임 환경 변수 BEDROCK_MODEL_ID 로 들어간다
  FakeLlm:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: 1이면 Bedrock을 호출하지 않고 고정 응답 (배포 자체만 먼저 확인할 때)

Resources:
  AgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role assumed by AgentCore Runtime to run the Busan guide agent
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeRolePolicy
            Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: AgentRuntimeExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LogsGroup
                Effect: Allow
                Action: [logs:DescribeLogStreams, logs:CreateLogGroup]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Sid: LogsWrite
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: Xray
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${AgentRuntimeName}-*
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:*
              - Sid: CodePackageRead
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}/${CodeKey}

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Ref AgentRuntimeName
      Description: Busan multilingual tourist guide agent
      RoleArn: !GetAtt AgentExecutionRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Runtime: PYTHON_3_13
          EntryPoint: [main.py]
          Code:
            S3:
              Bucket: !Ref CodeBucket
              Prefix: !Ref CodeKey
      NetworkConfiguration:
        NetworkMode: PUBLIC
      ProtocolConfiguration: HTTP
      EnvironmentVariables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        FAKE_LLM: !Ref FakeLlm

Outputs:
  AgentRuntimeArn:
    Description: invoke_agent_runtime 에 넘기는 ARN
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
  AgentRuntimeId:
    Value: !GetAtt AgentRuntime.AgentRuntimeId
